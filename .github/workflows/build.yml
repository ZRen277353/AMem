name: Build AMem

on:
  push:
    branches: [ dev, WinGui, docking ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  LLVM_VERSION: 18

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: ${{ env.LLVM_VERSION }}
        directory: ${{ runner.temp }}/llvm

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'c8696863d371ab7f46e213d8f5ca923c4aef2a00'

    - name: Install Capstone and Keystone
      run: |
        vcpkg install capstone:x64-windows keystone:x64-windows
      shell: bash

    - name: Configure CMake
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=TRUE \
          -DCMAKE_C_COMPILER="${{ runner.temp }}/llvm/bin/clang.exe" \
          -DCMAKE_CXX_COMPILER="${{ runner.temp }}/llvm/bin/clang++.exe" \
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -Dcapstone_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows" \
          -Dkeystone_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows" \
          -S . -B build -G Ninja
      shell: bash

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AMem-${{ github.sha }}
        path: |
          bin/ImGuiProject.exe
          bin/*.dll
        retention-days: 7
