name: Build AMem

on:
  push:
    branches: [ dev, WinGui, docking ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  LLVM_VERSION: 21

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: ${{ env.LLVM_VERSION }}
        directory: ${{ runner.temp }}/llvm

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v4

    - name: Configure CMake (without optional dependencies)
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=TRUE \
          -DCMAKE_C_COMPILER="${{ runner.temp }}/llvm/bin/clang.exe" \
          -DCMAKE_CXX_COMPILER="${{ runner.temp }}/llvm/bin/clang++.exe" \
          -S . -B build -G Ninja
      shell: bash

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      shell: bash

    - name: Copy runtime DLLs
      run: |
        # 项目中已有预编译的 DLL，确保它们在输出目录
        ls -la bin/
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AMem-${{ github.sha }}
        path: |
          bin/ImGuiProject.exe
          bin/*.dll
        retention-days: 7
